version: 2

# Weekly, one grouped pull request per ecosystem. A release must be a week old
# before it is proposed, so a compromised version is likely pulled first.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
