name: CI

# Third-party actions are pinned to a commit SHA, not a tag: a tag can be moved
# to point at different code without the reference here changing. The comment
# after each SHA is the release it corresponds to. To bump one, resolve the new
# tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` and update both.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep these in one place; scripts/setup-toolchain.sh reads the wasm-bindgen
  # version out of Cargo.lock so it can never drift from the crate.
  WASM_PACK_VERSION: 0.15.0
  BINARYEN_VERSION: version_131

jobs:
  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml is the single source of truth for the Rust version;
      # `rustup show` installs whatever it pins, including components/targets.
      - run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, at 2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # README.md and README.ja.md are translations of each other; catch a
      # section added to one and forgotten in the other.
      - run: ./scripts/check-docs.sh

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, at 2.9.1

      # bash is available on the Windows runner, so one script covers all three.
      # Putting tmp/bin on GITHUB_PATH once makes it visible to every later
      # step; exporting it inside each step instead is what let release.yml
      # reach `npm run test:rust` with no wasm-pack on PATH.
      - name: Install pinned toolchain
        shell: bash
        run: |
          ./scripts/setup-toolchain.sh
          echo "$PWD/tmp/bin" >> "$GITHUB_PATH"

      - name: Build all targets
        shell: bash
        run: ./scripts/build.sh

      # Shared with release.yml so the two cannot drift; see the script for
      # why the .wasm is excluded from the comparison.
      - name: dist/ is in sync with the sources
        shell: bash
        run: ./scripts/check-dist-sync.sh

      - name: Rust wasm tests
        shell: bash
        run: wasm-pack test --node

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/
          retention-days: 7

  test-node:
    name: node ${{ matrix.node }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is active LTS, 22 is in maintenance. 20 is EOL upstream but the
        # library still runs there, and engines says >=20, so keep it honest.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run test:node
      # Needs nothing but Node, so it rides along here rather than in the
      # runtime-specific jobs whose conditions it checks.
      - run: npm run test:exports
      - run: npm run typecheck

  test-deno:
    name: deno
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: vx.x.x
      - run: deno test --allow-read tests/deno.test.ts

  test-bun:
    name: bun
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun test tests/bun.test.ts

  test-workers:
    name: cloudflare workers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # --ignore-scripts skips workerd's postinstall, which normally copies the
      # binary into node_modules/workerd/bin. Verified not to matter: miniflare
      # resolves @cloudflare/workerd-<platform> directly at runtime.
      - run: npm ci --ignore-scripts
      - run: npm run test:workers

  test-browser:
    name: browser
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox
      - run: node tests/browser/run.mjs chromium firefox

  test-install:
    name: install from git
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # `npm i github:kechol/js-vaporetto` is the documented install path, so
      # verify the packed tarball actually resolves and runs. npm pack respects
      # the "files" field, which is what a git install ships.
      - name: npm pack and install into a scratch project
        run: |
          set -eux
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install /tmp/js-vaporetto-*.tgz
          cp "$GITHUB_WORKSPACE"/tests/fixtures/tiny.model .
          cat > check.mjs <<'EOF'
          import { Vaporetto, VAPORETTO_VERSION } from "js-vaporetto";
          import { readFileSync } from "node:fs";
          const v = Vaporetto.fromModel(readFileSync("tiny.model"));
          const got = v.tokenizeToString("今深海魚を数えたところだ");
          if (got !== "今 深海 魚 を 数え た ところ だ") throw new Error(`unexpected: ${got}`);
          console.log(`node ok, vaporetto ${VAPORETTO_VERSION}`);
          v.free();
          EOF
          node check.mjs
          bun check.mjs

      # See tests/workers/consumer-check.mjs for why the in-repo workers test
      # does not cover this.
      - name: Run the installed package on workerd
        run: |
          set -eux
          cd /tmp/consumer
          npm install wrangler@4
          cat > worker.mjs <<'EOF'
          import { Vaporetto } from "js-vaporetto";
          import model from "./tiny.model";
          export default {
            fetch() {
              const v = Vaporetto.fromModel(new Uint8Array(model));
              try {
                return new Response(v.tokenizeToString("今深海魚を数えたところだ"));
              } finally {
                v.free();
              }
            },
          };
          EOF
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "consumer",
            "main": "worker.mjs",
            "compatibility_date": "2026-07-22",
            "rules": [{ "type": "Data", "globs": ["**/*.model"], "fallthrough": true }]
          }
          EOF
          node "$GITHUB_WORKSPACE/tests/workers/consumer-check.mjs" /tmp/consumer

  test-deno-remote:
    name: deno remote import
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: vx.x.x

      # Importing dist/deno/vaporetto.js from a raw URL must work. Against a
      # pushed tag that URL is raw.githubusercontent.com; here the same files
      # are served locally so the check also runs on pull requests, where no
      # tag exists yet. --allow-net is needed because the glue fetches the
      # .wasm at runtime.
      - name: Import over HTTP
        run: |
          set -eux
          # Serves .wasm as application/octet-stream, exactly as
          # raw.githubusercontent.com does. Python's own http.server reports
          # application/wasm, which is what let a Deno import that fails
          # against the real URL pass this check.
          python3 tests/serve-like-raw-github.py 8731 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8731/ >/dev/null && break; sleep 0.5; done
          cat > /tmp/remote.ts <<'EOF'
          import { Vaporetto, VAPORETTO_VERSION } from "http://127.0.0.1:8731/dist/deno/vaporetto.js";
          const model = await Deno.readFile("tests/fixtures/tiny.model");
          const v = Vaporetto.fromModel(model);
          const got = v.tokenizeToString("今深海魚を数えたところだ");
          if (got !== "今 深海 魚 を 数え た ところ だ") throw new Error(`unexpected: ${got}`);
          console.log(`deno remote ok, vaporetto ${VAPORETTO_VERSION}`);
          v.free();
          EOF
          deno run --allow-read --allow-net=127.0.0.1:8731 --allow-import=127.0.0.1:8731 /tmp/remote.ts


  fixtures:
    name: fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, at 2.9.1
      - run: pip install zstandard

      # The model bytes are not reproducible across vaporetto revisions (tag
      # models are stored in BTreeMap order, which changed upstream), so assert
      # on behaviour rather than on a checksum.
      - name: Retrain and compare tokenization
        run: |
          set -eux
          ./tests/fixtures/train.sh
          node --test tests/node.test.mjs
          git checkout -- tests/fixtures/tiny.model tests/fixtures/tiny.model.zst
