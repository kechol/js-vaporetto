name: Release

# Third-party actions are pinned to a commit SHA, not a tag: a tag can be moved
# to point at different code without the reference here changing. The comment
# after each SHA is the release it corresponds to. To bump one, resolve the new
# tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` and update both.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, at 2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: vx.x.x

      # tmp/bin has to go on GITHUB_PATH, not just this step's PATH: later
      # steps run `npm run test:rust`, which invokes wasm-pack.
      - name: Install pinned toolchain
        run: |
          ./scripts/setup-toolchain.sh
          echo "$PWD/tmp/bin" >> "$GITHUB_PATH"

      # --- Everything that could make a release wrong is checked before we
      # --- publish anything. A tag is cheap to delete; a Release that people
      # --- have already fetched is not.

      - name: Version files agree with the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="${REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          crate="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          [ "$version" = "$pkg" ] || { echo "::error::tag $version != package.json $pkg"; exit 1; }
          [ "$version" = "$crate" ] || { echo "::error::tag $version != Cargo.toml $crate"; exit 1; }
          echo "version=$version" >> "$GITHUB_ENV"

      # The READMEs carry the actual install instructions, pinned to a tag, so a
      # stale tag there silently sends users to the previous release.
      - name: README install URLs point at this tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          bad=0
          for f in README.md README.ja.md; do
            if stale=$(grep -nE "js-vaporetto[/#]v[0-9]+\.[0-9]+\.[0-9]+" "$f" | grep -v "js-vaporetto[/#]${REF_NAME}\b"); then
              echo "::error file=$f::pinned URLs do not match ${REF_NAME}"
              echo "$stale"
              bad=1
            fi
            # Guard against the check passing because the URLs were removed
            # entirely rather than because they are correct.
            n=$(grep -cE "js-vaporetto[/#]${REF_NAME}\b" "$f" || true)
            if [ "$n" -lt 4 ]; then
              echo "::error file=$f::expected 4 pinned install URLs for ${REF_NAME}, found $n"
              bad=1
            fi
          done
          exit "$bad"

      - name: CHANGELOG has an entry for this version
        run: |
          set -eu
          grep -qE "^## \[${version}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          }
          # Everything between this heading and the next one becomes the
          # release body.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::the '## [${version}]' section is empty"
            exit 1
          fi

      # The tag has to describe what is actually committed under dist/.
      # Shared with ci.yml so the two cannot drift — they did, and it only
      # showed up when a tag was pushed.
      - name: dist/ matches the sources at this tag
        run: ./scripts/check-dist-sync.sh

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:rust
      - run: npm run test:node
      - run: npm run test:deno

      # --- artifacts ---------------------------------------------------------

      - name: Build release artifacts
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eux
          mkdir -p artifacts
          # npm pack respects the "files" field, so the tarball is exactly what
          # `npm i github:kechol/js-vaporetto` delivers.
          npm pack --pack-destination artifacts
          # The web target on its own, for dropping into a static site.
          (cd dist && zip -qr "../artifacts/js-vaporetto-web-${REF_NAME}.zip" web)
          # List the inputs explicitly: `./*` would fold SHA256SUMS.txt into
          # itself on a re-run.
          (cd artifacts && sha256sum ./*.tgz ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Only meaningful once the tag exists on raw.githubusercontent.com, which
      # is why this cannot run in the PR workflow. --allow-net is needed in
      # addition to the import: the glue fetches the .wasm at runtime.
      - name: The documented Deno raw-URL import works
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eux
          node -e '
            const tag = process.env.REF_NAME;
            const url = `https://raw.githubusercontent.com/${process.env.REPO}/${tag}/dist/deno/vaporetto.js`;
            const body = [
              `import { Vaporetto, VAPORETTO_VERSION, JS_VAPORETTO_VERSION } from ${JSON.stringify(url)};`,
              `const model = await Deno.readFile("tests/fixtures/tiny.model");`,
              `const v = Vaporetto.fromModel(model);`,
              `const got = v.tokenizeToString("今深海魚を数えたところだ");`,
              `if (got !== "今 深海 魚 を 数え た ところ だ") throw new Error("unexpected: " + got);`,
              `if (JS_VAPORETTO_VERSION !== ${JSON.stringify(tag.replace(/^v/, ""))}) {`,
              `  throw new Error("wrapper reports " + JS_VAPORETTO_VERSION);`,
              `}`,
              `console.log("deno raw-url import ok, vaporetto " + VAPORETTO_VERSION);`,
              `v.free();`,
            ].join("\n");
            require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/tagged.ts", body);
          '
          deno run --allow-read --allow-net=raw.githubusercontent.com "$RUNNER_TEMP/tagged.ts"

      - name: Compose the release body
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          {
            printf 'Unofficial WebAssembly bindings for Vaporetto. Not affiliated with or\n'
            printf 'endorsed by daac-tools.\n\n'
            cat release-body.md
            printf '\n### Install\n\n'
            printf '```sh\nnpm i github:%s#%s\n```\n\n' "$REPO" "$REF_NAME"
            printf 'Deno:\n\n```ts\nimport { Vaporetto } from "https://raw.githubusercontent.com/%s/%s/dist/deno/vaporetto.js";\n```\n\n' "$REPO" "$REF_NAME"
            printf 'Models are not bundled. See the [README](https://github.com/%s/blob/%s/README.md#models-are-not-bundled) for where to get one.\n' "$REPO" "$REF_NAME"
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/*.tgz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
