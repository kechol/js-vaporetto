[package]
name = "js-vaporetto"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Unofficial WebAssembly bindings for the Vaporetto Japanese tokenizer"
repository = "https://github.com/kechol/js-vaporetto"
homepage = "https://github.com/kechol/js-vaporetto#readme"
readme = "README.md"
keywords = ["japanese", "tokenizer", "wasm", "vaporetto", "nlp"]
categories = ["text-processing", "wasm"]
# Not published to crates.io: this crate is a cdylib whose only consumer is the
# generated JavaScript in dist/. Anyone wanting Vaporetto from Rust should
# depend on the `vaporetto` crate directly.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["zstd"]
# Enables fromCompressedModel. Decompression happens in Rust via ruzstd.
zstd = ["dep:ruzstd"]
# Uses daachorse's charwise automaton. Measured against
# bccwj-suw+unidic_pos+pron over 342k characters, tokenization gets 5-8%
# faster while model loading takes twice as long (+1,050 ms) and the wasm
# grows 8.6%. Break-even is around 45 million characters per model load, so
# this is off by default; only worth enabling for a long-lived server process
# that tokenizes far more than that.
charwise-pma = ["vaporetto/charwise-pma"]
# Turns a wasm panic from "unreachable" into a readable stack trace.
# Increases size, so do not enable it for release builds.
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.126"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.103"
ruzstd = { version = "0.8", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

# The default features of vaporetto 0.6.5 are
#   ["std", "cache-type-score", "fix-weight-length", "tag-prediction", "charwise-pma"]
# This list is those minus charwise-pma (see the [features] section above) plus
# kytea, which KyteaModel::read requires. Never enable train for wasm: it pulls
# in liblinear, which builds C sources.
[dependencies.vaporetto]
version = "=0.6.5"
default-features = false
features = [
    "std",
    "cache-type-score",
    "fix-weight-length",
    "tag-prediction",
    "kytea",
]

[dependencies.vaporetto_rules]
version = "=0.6.5"

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The wasm-opt that wasm-pack ships is hardcoded to binaryen version_117
# (released 2024-02-28), and Cargo.toml offers no way to pin a different one.
# So it is disabled here and scripts/build.sh runs a pinned wasm-opt instead.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
