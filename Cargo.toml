[package]
name = "js-vaporetto"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Unofficial WebAssembly bindings for the Vaporetto Japanese tokenizer"
repository = "https://github.com/kechol/js-vaporetto"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.126"

# 0.6.5 の default features は
#   ["std", "cache-type-score", "fix-weight-length", "tag-prediction", "charwise-pma"]
# ここではそれに kytea（KyteaModel::read に必須）を足したものを明示指定している。
# train は liblinear(C) を引くので wasm では絶対に有効化しない。
[dependencies.vaporetto]
version = "=0.6.5"
default-features = false
features = [
    "std",
    "cache-type-score",
    "fix-weight-length",
    "tag-prediction",
    "charwise-pma",
    "kytea",
]

[dependencies.vaporetto_rules]
version = "=0.6.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# wasm-pack が同梱する wasm-opt は binaryen version_117 (2024-02-28) にハードコードされており、
# Cargo.toml からバージョンを固定する手段が存在しない。よってここでは無効化し、
# ビルドスクリプト側で固定バージョンの wasm-opt を明示的に実行する。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
