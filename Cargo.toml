[package]
name = "js-vaporetto"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Unofficial WebAssembly bindings for the Vaporetto Japanese tokenizer"
repository = "https://github.com/kechol/js-vaporetto"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["zstd"]
# fromCompressedModel を有効にする。解凍は ruzstd で Rust 側で行う。
zstd = ["dep:ruzstd"]
# daachorse の charwise 版オートマトンを使う。実測（bccwj-suw+unidic_pos+pron,
# 342k 文字）では tokenize が 5〜8% 速くなる一方、モデル読込が 2 倍（+1,050ms）
# 遅くなり wasm が +8.6% 大きくなる。損益分岐は約 4,500 万文字なので既定は無効。
# 長時間動かすサーバ用途で大量に処理する場合のみ有効にする価値がある。
charwise-pma = ["vaporetto/charwise-pma"]
# panic を "unreachable" ではなく読めるスタックトレースにする。
# サイズが増えるのでリリースビルドでは有効にしない。
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.126"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.103"
ruzstd = { version = "0.8", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

# 0.6.5 の default features は
#   ["std", "cache-type-score", "fix-weight-length", "tag-prediction", "charwise-pma"]
# ここではそれに kytea（KyteaModel::read に必須）を足したものを明示指定している。
# train は liblinear(C) を引くので wasm では絶対に有効化しない。
[dependencies.vaporetto]
version = "=0.6.5"
default-features = false
features = [
    "std",
    "cache-type-score",
    "fix-weight-length",
    "tag-prediction",
    "kytea",
]

[dependencies.vaporetto_rules]
version = "=0.6.5"

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# wasm-pack が同梱する wasm-opt は binaryen version_117 (2024-02-28) にハードコードされており、
# Cargo.toml からバージョンを固定する手段が存在しない。よってここでは無効化し、
# ビルドスクリプト側で固定バージョンの wasm-opt を明示的に実行する。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
